name: Build Pygame Mobile APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v3

    - name: Set up System Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Android Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libltdl-dev openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev lld
        pip install --upgrade pip setuptools cython
        pip install buildozer

    - name: Generate Custom Buildozer Pygame Configuration
      run: |
        buildozer init
        sed -i 's/source.include_exts = py/source.include_exts = py,png,txt/' buildozer.spec
        sed -i 's/orientation = portrait/orientation = landscape/' buildozer.spec
        # UPGRADING DRIVERS FROM DEPRECATED PYGAME TO STABLE PYGAME-CE FOR MOBILE SUPPORT
        sed -i 's/requirements = python3,kivy/requirements = python3,pygame-ce,numpy/' buildozer.spec
        sed -i 's/title = My Application/title = Dino Game/' buildozer.spec
        sed -i 's/package.name = myapp/package.name = dinogame/' buildozer.spec

    - name: Compile Pygame to APK
      run: |
        yes | buildozer -v android debug
        
    - name: Upload Finished APK for Download
      uses: actions/upload-artifact@v3
      with:
        name: Pygame-DinoGame-APK
        path: bin/*.apk
